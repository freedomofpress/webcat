<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; img-src chrome: 'self' https: data:; object-src 'none';"
    />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="stylesheet"
      href="chrome://global/skin/design-system/tokens-brand.css"
    />
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js"></script>
  </head>
  <body>
    <div id="views">
      <section id="main" class="view">
        <header id="header-row">
          <div id="site">
            <img id="favicon" alt="" />
            <span id="host"></span>
          </div>
          <button id="status" class="subviewbutton nav" hidden>
            <img id="status-icon" alt="" />
            <span id="status-label"></span>
          </button>
        </header>
        <div id="main-body" class="panel-subview-body"></div>
      </section>
      <section id="sub" class="view">
        <header class="panel-header">
          <button id="back" class="back" aria-label="Back"></button>
          <h1><span data-i18n="advanced"></span></h1>
        </header>
        <hr />
        <div id="sub-body" class="panel-subview-body"></div>
      </section>
    </div>
  </body>
</html>
